name: Integration

# DB-backed proof runs for database-risk changes, on a daily schedule, and on
# demand — not on every ordinary push. The path filters name every tree the
# DB-backed suite selects from; web-only and docs-only changes are exactly
# what they exempt. The schedule is the safety net: even if a filter gap ever
# skipped a risky change, the exhaustive daily run still owns it.
on:
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "core/**"
      - "domains/**"
      - "infra/**"
      - "tests/**"
      - "conftest.py"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - "sources.yaml"
      - ".github/workflows/integration.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "core/**"
      - "domains/**"
      - "infra/**"
      - "tests/**"
      - "conftest.py"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - "sources.yaml"
      - ".github/workflows/integration.yml"
  schedule:
    # Daily, offset from nightly.yml so the two heavy runs never overlap.
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: civibus_integration_local
      CIVIBUS_REQUIRE_DB: "1"
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_PORT: "5475"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --locked --extra dev --extra entity-resolution
      - name: Start DB
        run: make db-up
      - name: Wait for DB health
        run: |
          container_id="$(docker compose -f infra/docker-compose.yml ps -q db)"
          if [ -z "$container_id" ]; then
            echo "Database container ID not found" >&2
            exit 1
          fi
          for attempt in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$container_id")"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Database did not become healthy in time" >&2
          exit 1
      - name: Reset DB schema
        run: make db-reset
      - name: Seed FEC bulk data
        run: make ingest-fec-bulk-sample
      - name: Load graph
        run: make graph-load
      - name: DB-backed product suite
        run: |
          # The database has already been started, health-checked, reset, seeded,
          # and graph-loaded by the repo-owned setup path above. Keep this gate as
          # the complete DB-backed product slice and let the quarantine marker
          # exclude only known-bad exact nodes.
          uv run --locked pytest -m "integration and not quarantined" \
            api/ \
            core/ \
            domains/ \
            tests/integration/ \
            tests/e2e/ \
            tests/test_db_integration.py \
            tests/test_graph_queries.py \
            tests/test_relational_queries.py
      - name: Integration tests
        run: uv run --locked pytest tests/ci/test_integration_smoke.py --tb=short
      - name: Stop DB
        if: always()
        run: make db-down

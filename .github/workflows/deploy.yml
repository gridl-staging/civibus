name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    if: github.repository == 'gridl-hq/civibus'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      PROD_SMOKE_BASE_URL: ${{ vars.PROD_SMOKE_BASE_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        env:
          FLY_API_TOKEN: ""

      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          python-version: "3.12"

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        env:
          FLY_API_TOKEN: ""

      - name: Resolve dev build provenance
        id: provenance
        shell: bash
        env:
          FLY_API_TOKEN: ""
        run: |
          set -euo pipefail
          # Stamp the DEV-repo commit SHA from the sync manifest (the workflow
          # trigger SHA is the prod-mirror namespace and is not comparable to
          # civibus_dev/main) so downstream drift detection works. Fail loud
          # rather than degrade to "unknown".
          manifest=".debbie/sync_manifest.json"
          if [[ ! -f "$manifest" ]]; then
            echo "Missing $manifest — cannot stamp dev build provenance" >&2
            exit 1
          fi
          dev_sha="$(jq -r '.dev_sha // ""' "$manifest")"
          if [[ ! "$dev_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid dev_sha in $manifest: '$dev_sha' (expected 40-char hex)" >&2
            exit 1
          fi
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "dev_sha=$dev_sha" >> "$GITHUB_OUTPUT"
          echo "built_at=$built_at" >> "$GITHUB_OUTPUT"

      - name: Capture pre-deploy serving images
        id: pre_deploy
        shell: bash
        run: |
          set -euo pipefail
          # Records what each serving app is running BEFORE anything is deployed
          # over it, so a failed production verification has a concrete rollback
          # target. No `continue-on-error`: a deploy with no safety net must not
          # proceed. Owner of the app list and image lookup is the delegated
          # script, keeping app names out of this workflow entirely.
          bash infra/scripts/rollback_serving_apps.sh capture "$RUNNER_TEMP/pre_deploy_images.txt"

      - name: Deploy API to Fly
        id: deploy_api
        shell: bash
        run: |
          set -euo pipefail
          flyctl deploy -c infra/fly/api.fly.toml --remote-only --build-arg CIVIBUS_GIT_SHA=${{ steps.provenance.outputs.dev_sha }} --build-arg CIVIBUS_BUILT_AT=${{ steps.provenance.outputs.built_at }}
          # `flyctl deploy` returns once the Fly release is `started`, which can be
          # before api/canary_check.py has finished proving the API healthy. This
          # step must therefore observe public API readiness itself before web/caddy
          # deploy and the later whole-surface gates proceed: the built dev SHA at
          # /api/health/version AND byte-exact {"healthy":true} at /api/health/content
          # in the same retry attempt. FLY_API_TOKEN is intentionally NOT blanked here
          # (unlike the curl-only verification steps) because flyctl deploy above needs it.
          if [[ -z "${PROD_SMOKE_BASE_URL}" ]]; then
            echo "Deploy API step requires PROD_SMOKE_BASE_URL Actions variable for public API readiness verification" >&2
            exit 1
          fi
          expected_sha="${{ steps.provenance.outputs.dev_sha }}"
          version_url="${PROD_SMOKE_BASE_URL%/}/api/health/version"
          content_url="${PROD_SMOKE_BASE_URL%/}/api/health/content"
          api_sha="unknown"
          content_body="unknown"
          for attempt in $(seq 1 18); do
            api_sha="$(curl -fsS "$version_url" | jq -r '.git_sha // "unknown"' || true)"
            content_body="$(curl -fsS "$content_url" || true)"
            if [[ "$api_sha" == "$expected_sha" && "$content_body" == '{"healthy":true}' ]]; then
              echo "api_public_ready expected=$expected_sha api=$api_sha content=$content_body"
              exit 0
            fi
            echo "waiting_for_api_public_ready attempt=$attempt expected=$expected_sha api=$api_sha content=$content_body"
            sleep 5
          done
          echo "api_public_not_ready expected=$expected_sha api=$api_sha content=$content_body" >&2
          exit 1

      - name: Deploy web to Fly
        id: deploy_web
        shell: bash
        run: |
          set -euo pipefail
          # The positional web directory changes -c resolution, so anchor the config at the workspace.
          flyctl deploy web -c "$GITHUB_WORKSPACE/infra/fly/web.fly.toml" --remote-only --build-arg CIVIBUS_GIT_SHA=${{ steps.provenance.outputs.dev_sha }} --build-arg CIVIBUS_BUILT_AT=${{ steps.provenance.outputs.built_at }}

      - name: Deploy Caddy to Fly
        id: deploy_caddy
        shell: bash
        run: |
          set -euo pipefail
          flyctl deploy -c infra/fly/caddy.fly.toml --remote-only

      - name: Verify public deploy serves built dev SHA
        id: verify_sha
        shell: bash
        env:
          FLY_API_TOKEN: ""
        run: |
          set -euo pipefail
          if [[ -z "${PROD_SMOKE_BASE_URL}" ]]; then
            echo "Deploy workflow requires PROD_SMOKE_BASE_URL Actions variable for production drift verification" >&2
            exit 1
          fi
          expected_sha="${{ steps.provenance.outputs.dev_sha }}"
          api_url="${PROD_SMOKE_BASE_URL%/}/api/health/version"
          web_url="${PROD_SMOKE_BASE_URL%/}/version.json"
          api_sha="unknown"
          web_sha="unknown"
          for attempt in $(seq 1 18); do
            api_sha="$(curl -fsS "$api_url" | jq -r '.git_sha // "unknown"' || true)"
            web_sha="$(curl -fsS "$web_url" | jq -r '.git_sha // "unknown"' || true)"
            if [[ "$api_sha" == "$expected_sha" && "$web_sha" == "$expected_sha" ]]; then
              echo "public_sha_match expected=$expected_sha api=$api_sha web=$web_sha"
              exit 0
            fi
            echo "waiting_for_public_sha attempt=$attempt expected=$expected_sha api=$api_sha web=$web_sha"
            sleep 5
          done
          echo "public_sha_drift expected=$expected_sha api=$api_sha web=$web_sha" >&2
          exit 1

      - name: Run deployed surface parity gate
        id: parity_gate
        shell: bash
        env:
          FLY_API_TOKEN: ""
        run: |
          set -euo pipefail
          # jul30_10pm_8 promotes the money gate; PROMOTED_FATAL_ASSERTIONS in
          # public_money_value_probe.py owns which assertions kill a deploy.
          CIVIBUS_PUBLIC_BASE_URL="${PROD_SMOKE_BASE_URL}" \
          CIVIBUS_EXPECTED_SHA="${{ steps.provenance.outputs.dev_sha }}" \
          CIVIBUS_PUBLIC_MONEY_VALUE_FATAL=1 \
            bash infra/scripts/probe_deployed_surface_parity.sh

      - name: Install web smoke dependencies
        id: smoke_deps
        shell: bash
        working-directory: web
        env:
          FLY_API_TOKEN: ""
        run: |
          set -euo pipefail
          npm ci

      - name: Run production smoke gate
        id: smoke_gate
        shell: bash
        working-directory: web
        env:
          FLY_API_TOKEN: ""
        run: |
          set -euo pipefail
          if [[ -z "${PROD_SMOKE_BASE_URL}" ]]; then
            echo "Deploy workflow requires PROD_SMOKE_BASE_URL Actions variable for production smoke mode" >&2
            exit 1
          fi
          SMOKE_MODE=production SMOKE_BASE_URL="${PROD_SMOKE_BASE_URL}" \
            bash ./tests/smoke/run-playwright.sh -- tests/smoke/production_deploy.spec.ts tests/smoke/production_finance_visuals.spec.ts tests/smoke/primary_nav_nonempty.spec.ts --reporter=line

      - name: Roll back serving apps on failed production verification
        id: rollback
        if: ${{ always() && steps.pre_deploy.outcome == 'success' && (steps.deploy_api.outcome == 'failure' || steps.deploy_web.outcome == 'failure' || steps.deploy_caddy.outcome == 'failure' || steps.verify_sha.outcome == 'failure' || steps.parity_gate.outcome == 'failure' || steps.smoke_gate.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          # Production is serving something that failed verification. Put every
          # serving app back on the image captured at the top of this run.
          #
          # The condition above names serving and verification outcomes one by
          # one instead of using a bare failure(). `steps.deploy_refresh` is
          # deliberately absent: the refresh machine carries no user traffic, and
          # rolling production back because it failed would undo a healthy
          # deploy. `steps.smoke_deps` is absent for the same reason -- an npm
          # install failure is a tooling problem, not evidence about production.
          bash infra/scripts/rollback_serving_apps.sh restore "$RUNNER_TEMP/pre_deploy_images.txt"

      - name: Deploy refresh machine
        id: deploy_refresh
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/refresh_deploy_evidence"
          mkdir -p "$evidence"
          bash infra/scripts/deploy_refresh_machine.sh --evidence-dir "$evidence" --dev-sha "${{ steps.provenance.outputs.dev_sha }}"

      - name: Persist refresh deploy evidence
        if: ${{ always() && steps.deploy_refresh.outcome != 'skipped' }}
        env:
          FLY_API_TOKEN: ""
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: refresh_deploy_evidence
          path: ${{ runner.temp }}/refresh_deploy_evidence
          if-no-files-found: error
          retention-days: 14

name: Nightly

# Exhaustive scheduled proof: the tiers deliberately kept OUT of the per-push
# fast loop. backend-full owns the complete public unit suite plus coverage,
# web-full owns the complete web gate set, and the two browser-smoke jobs own the
# Playwright journeys: browser-smoke runs the LIVE lane against a seeded database
# and browser-smoke-fixture runs the FIXTURE lane, including the screenshot
# oracle. Which spec belongs to which lane is declared once, in
# web/tests/smoke/execution-contract.json. The DB-backed integration suite is NOT
# duplicated here — integration.yml carries its own daily schedule (offset by 30
# minutes so the two heavy runs never contend).
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: >-
          Rewrite the finance-visuals screenshot baselines on this runner and
          publish them as the finance-visuals-playwright artifact. Download,
          unzip, and commit the *-chromium.png files it contains.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend-full:
    name: backend-full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --locked --extra dev --extra entity-resolution
      # coverage-public runs the complete public unit selection (any test
      # failure fails it), so a separate plain run would only double runtime.
      - name: Full public unit suite with coverage floor
        run: make coverage-public

  web-full:
    name: web-full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Web unit tests
        working-directory: web
        # Hard cap owned by tests/ci/pytest_tier_classifier.py::SUITE_TIME_BUDGETS
        # (edit_fast tier); pinned by test_suite_time_budget_contract.py.
        timeout-minutes: 3
        run: npm test
      - name: Web type check
        working-directory: web
        run: npm run check
      - name: Web production build
        working-directory: web
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: civibus_integration_local
      CIVIBUS_REQUIRE_DB: "1"
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_PORT: "5475"
      # DEMO_KEY is api.data.gov's public demonstration key, not a secret.
      # The smoke fixture ingests live FEC data when the key works and falls
      # back to local fixture ingest only on an HTTP 429 rate limit — its own
      # documented predicate — so the pipeline is validated either way and a
      # missing-key hard failure cannot occur here.
      FEC_API_KEY: DEMO_KEY
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --locked --extra dev --extra entity-resolution
      - name: Start DB
        run: make db-up
      - name: Wait for DB health
        run: make db-wait
      - name: Reset DB schema
        run: make db-reset
      # test-e2e-smoke runs exactly the two smoke modules no merge-time or
      # coverage selection executes (e2e-only by marker), quarantine-aware.
      # Both modules seed themselves from local fixtures and the state sample
      # module resets the database, which is why this job owns a disposable
      # DB of its own instead of sharing browser-smoke's federal seed.
      - name: End-to-end smoke suite
        run: make test-e2e-smoke
      - name: Stop DB
        if: always()
        run: make db-down

  browser-smoke:
    name: browser-smoke
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: civibus_integration_local
      CIVIBUS_REQUIRE_DB: "1"
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_PORT: "5475"
      # Without live mode the Playwright runner boots its Node fixture backend
      # and skips every DB-touching journey, leaving the seeded database dead
      # weight. Live mode makes the runner start uvicorn against it.
      SMOKE_USE_LIVE_API: "1"
      # Specimen pins for the Playwright fixtures. test_support/browser_smoke_seed.py
      # owns these values; tests/ci/test_ci_workflow_contract.py imports them
      # from there and fails this workflow's contract on any drift.
      SMOKE_PERSON_ID: "11111111-1111-4111-8111-111111111111"
      SMOKE_COMMITTEE_SLUG: "citizens-for-civibus"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Sync dependencies
        run: uv sync --locked --extra dev --extra entity-resolution
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Start DB
        run: make db-up
      - name: Wait for DB health
        run: make db-wait
      - name: Reset DB schema
        run: make db-reset
      - name: Seed FEC bulk data
        run: make ingest-fec-bulk-sample
      - name: Load graph
        run: make graph-load
      # The bulk sample supplies volume; the seed replaces its entities with
      # the deterministic specimens the journeys assert on. It must run after
      # graph-load, whose entity nodes the seed rewrites, and before any
      # journey reads a page.
      - name: Seed browser-smoke live data
        run: uv run --extra dev --extra entity-resolution python -m test_support.browser_smoke_seed
      - name: Browser smoke journeys
        working-directory: web
        run: npm run test:smoke
      - name: Stop DB
        if: always()
        run: make db-down

  # The other half of the execution contract in web/tests/smoke/execution-contract.json.
  # browser-smoke above runs the LIVE lane; this job runs the FIXTURE lane, which is
  # the named owner for every spec whose oracle a federal-first seed cannot satisfy —
  # the parked NC county, property and roster surfaces, the fixture-backed registry
  # routes, and the shell/responsive layout suite. Without it those specs would be
  # excluded from the live lane and owned by nothing, which is the failure mode the
  # split exists to avoid.
  #
  # It also owns the screenshot oracle in finance-visuals.spec.ts, which is fixture-only
  # by its own describe-level skip. browser-smoke never executes a single
  # toHaveScreenshot, and before this job existed no workflow anywhere did — which is
  # exactly how seven baselines came to enshrine charts with clipped y-axis labels as
  # "correct".
  #
  # It needs no database and no Python: fixture mode boots the Node fixture
  # backend plus a preview server, so the whole job is checkout + npm + browser.
  #
  # It is also the ONLY supported way to regenerate a screenshot baseline. Screenshots
  # are platform-bound and playwright.config.ts's snapshot pathTemplate carries no
  # platform token (one baseline serves every platform), so a baseline written
  # on a developer's macOS differs from this runner's by ~1% of pixels on an
  # entirely unchanged page. Regeneration procedure lives in
  # docs/reference/ui_chart_encoding.md.
  browser-smoke-fixture:
    name: browser-smoke-fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      # No spec-file arguments: the fixture lane is whatever the execution
      # contract declares fixture-eligible, so adding or retiring a spec changes
      # this job's selection through the contract instead of through this file.
      # --update-snapshots only rewrites toHaveScreenshot baselines, which exist
      # in finance-visuals.spec.ts alone, so a regeneration dispatch is still
      # scoped to the screenshot oracle even though the run is now wider.
      - name: Fixture-lane smoke journeys
        working-directory: web
        # Hard cap owned by tests/ci/pytest_tier_classifier.py::SUITE_TIME_BUDGETS
        # (qa_nightly tier); pinned by test_suite_time_budget_contract.py.
        timeout-minutes: 10
        env:
          # Empty on `schedule` (the inputs context only carries workflow_dispatch
          # values), so the scheduled run always asserts rather than rewrites.
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
        run: |
          set -euo pipefail
          update_flag=()
          if [[ "${UPDATE_SNAPSHOTS:-false}" == "true" ]]; then
            update_flag=(--update-snapshots)
          fi
          npm run test:smoke -- --reporter=line "${update_flag[@]}"
      # Runs on failure too: without it a red screenshot assertion in CI leaves
      # nothing to look at, which was the second half of the un-landable-layout
      # blocker. test-results/ carries the *-actual.png / *-diff.png pair for a
      # mismatch; the snapshots directory carries the rewritten baselines after
      # an update_snapshots dispatch. if-no-files-found may stay `error` because
      # the committed snapshots directory is never empty.
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finance-visuals-playwright
          path: |
            web/test-results/
            web/tests/smoke/finance-visuals.spec.ts-snapshots/
          if-no-files-found: error
          retention-days: 14

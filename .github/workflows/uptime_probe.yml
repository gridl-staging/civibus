name: Uptime probe — /api/health/content

# External-infrastructure verifier. It requests a four-hour GitHub scheduled uptime probe
# of ${{ env.PROBE_BASE_URL }}/api/health/content and opens / comments-on / closes a
# GitHub issue with the `uptime-incident` label based on the response. GitHub scheduled
# workflows are best-effort, not a delivery SLA. Under the repo's previous five-minute
# request, the recent observed sample was n=11 scheduled gaps at 64-216 minutes. This
# historical sample is not a guaranteed delivery interval for this cron. There is no
# five-minute SLA or detection guarantee.
#
# Anchored postmortem: docs/howto/operations/postmortems/2026_04_30_prod_data_link_severed.md
# Apr 30 incident hid for 16h because every observer ran on or near the
# prod VM. This workflow is structurally outside that loop — it runs on
# GitHub's infrastructure, not Hetzner — so when the prod stack is
# broken, *something on different infrastructure* still notices.
#
# Sync flow: dev repo (gridl-dev/civibus_dev) has Actions disabled, so
# this file does not execute here. debbie syncs it to staging + prod
# public repos where it does execute.

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      probe_url_override:
        description: Full one-run probe URL override for manual drills
        required: false
        default: ""
        type: string

env:
  PROBE_BASE_URL: https://civibus.shareborough.com

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    steps:
      - name: Probe content health endpoint
        id: probe
        env:
          PROBE_URL_OVERRIDE: ${{ github.event.inputs.probe_url_override }}
        run: |
          set -euo pipefail

          normalize_probe_target() {
            python3 - "$1" <<'PY'
          import sys
          from urllib.parse import urlsplit, urlunsplit


          raw_url = sys.argv[1].strip()
          if not raw_url or any(ord(ch) < 32 or ord(ch) == 127 for ch in raw_url):
              raise SystemExit(1)

          parsed = urlsplit(raw_url)
          if parsed.scheme != "https":
              raise SystemExit(1)
          if not parsed.hostname:
              raise SystemExit(1)
          if parsed.username is not None or parsed.password is not None:
              raise SystemExit(1)
          if parsed.fragment:
              raise SystemExit(1)

          hostname = parsed.hostname
          if ":" in hostname and not hostname.startswith("["):
              hostname = f"[{hostname}]"
          netloc = hostname if parsed.port is None else f"{hostname}:{parsed.port}"
          print(urlunsplit((parsed.scheme, netloc, parsed.path, parsed.query, "")))
          PY
          }

          RAW_TARGET="${PROBE_URL_OVERRIDE:-${PROBE_BASE_URL}/api/health/content}"
          HEALTHY=false
          DETAIL=""
          if ! TARGET="$(normalize_probe_target "$RAW_TARGET")"; then
            TARGET="invalid"
            STATUS="000"
            CURL_EXIT=2
            DETAIL="invalid probe URL (must be credential-free HTTPS without fragments or control characters)"
          else
            set +e
            STATUS=$(curl --proto '=https' -sS \
              --max-time 30 \
              --write-out '%{http_code}' \
              --output /tmp/body.json \
              -- "$TARGET")
            CURL_EXIT=$?
            set -e
          fi

          # Healthiness logic:
          #   - curl error (timeout, connection refused) => unhealthy
          #   - HTTP 200 + body.healthy == true        => healthy
          #   - anything else                          => unhealthy
          if [ -n "$DETAIL" ]; then
            :
          elif [ "$CURL_EXIT" -ne 0 ]; then
            DETAIL="curl exit $CURL_EXIT (timeout, connection refused, or DNS failure)"
          elif [ "$STATUS" = "200" ]; then
            if jq -e '.healthy == true' /tmp/body.json > /dev/null 2>&1; then
              HEALTHY=true
            else
              BODY_EXCERPT=$(jq -c . /tmp/body.json 2>/dev/null | head -c 500 || head -c 500 /tmp/body.json)
              DETAIL="HTTP 200 but body.healthy not true: ${BODY_EXCERPT}"
            fi
          else
            BODY_EXCERPT=$(head -c 500 /tmp/body.json 2>/dev/null || true)
            DETAIL="HTTP ${STATUS} body=${BODY_EXCERPT}"
          fi

          echo "healthy=${HEALTHY}" >> "$GITHUB_OUTPUT"
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"
          # Multi-line-safe output for DETAIL (may contain JSON / newlines).
          DETAIL_DELIMITER="DETAIL_DELIMITER_$(uuidgen)"
          {
            echo "detail<<${DETAIL_DELIMITER}"
            printf '%s\n' "${DETAIL}"
            echo "${DETAIL_DELIMITER}"
          } >> "$GITHUB_OUTPUT"
          echo "Probe result: healthy=${HEALTHY} status=${STATUS}"

      # Manifest-owned production surfaces run before issue filing so their
      # aggregate result can participate in the incident flow. Stage 5 owns the
      # downstream consumer rewiring. `continue-on-error` preserves that flow
      # after a red row; the step still exits non-zero after exporting every red.
      - name: Check manifest-declared public surfaces
        id: public_surfaces
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          MANIFEST_HEADER=$'surface_id\tkind\tpath\tmarker\tparity_mode\tuptime_mode\towners'
          TMP_DIR="$(mktemp -d)"
          MANIFEST_FILE="${TMP_DIR}/public_surface_probes.tsv"
          DETAIL_FILE="${TMP_DIR}/detail.txt"
          SEEN_IDS_FILE="${TMP_DIR}/seen_ids.txt"
          RED_IDS=""
          : > "$DETAIL_FILE"
          : > "$SEEN_IDS_FILE"
          trap 'rm -rf "$TMP_DIR"' EXIT

          record_failure() {
            local surface_id="$1"
            local reason="$2"
            if [ -n "$RED_IDS" ]; then
              RED_IDS="${RED_IDS},${surface_id}"
            else
              RED_IDS="$surface_id"
            fi
            printf '%s %s\n' "$surface_id" "$reason" >> "$DETAIL_FILE"
            echo "::error::public surface probe surface_id=${surface_id} ${reason}"
          }

          emit_outputs() {
            local healthy=true
            if [ -n "$RED_IDS" ]; then
              healthy=false
            fi
            echo "healthy=${healthy}" >> "$GITHUB_OUTPUT"
            echo "red_ids=${RED_IDS}" >> "$GITHUB_OUTPUT"
            DETAIL_DELIMITER="DETAIL_DELIMITER_$(uuidgen)"
            {
              echo "detail<<${DETAIL_DELIMITER}"
              cat "$DETAIL_FILE"
              echo "${DETAIL_DELIMITER}"
            } >> "$GITHUB_OUTPUT"
          }

          manifest_error() {
            record_failure public_surface_manifest_error "$1"
            return 1
          }

          validate_field() {
            local row_number="$1"
            local field_name="$2"
            local value="$3"
            if [ -z "${value//[[:space:]]/}" ]; then
              manifest_error "reason=blank_field row=${row_number} field=${field_name}"
            fi
          }

          validate_enum() {
            local row_number="$1"
            local field_name="$2"
            local value="$3"
            local allowed_values="$4"
            case " ${allowed_values} " in
              *" ${value} "*) return 0 ;;
            esac
            manifest_error "reason=unknown_${field_name} row=${row_number} value=${value}"
          }

          validate_manifest() {
            local header line without_tabs field_count existing_rows=0 row_number=1
            local surface_id kind path marker parity_mode uptime_mode owners
            exec 3< "$MANIFEST_FILE"
            IFS= read -r header <&3 || {
              manifest_error "reason=missing_header"
              return 1
            }
            if [ "$header" != "$MANIFEST_HEADER" ]; then
              manifest_error "reason=invalid_header"
              return 1
            fi
            while IFS= read -r line <&3 || [ -n "$line" ]; do
              row_number=$((row_number + 1))
              without_tabs="${line//$'\t'/}"
              field_count=$((${#line} - ${#without_tabs} + 1))
              if [ "$field_count" -ne 7 ]; then
                manifest_error "reason=field_count row=${row_number} actual=${field_count} expected=7"
                return 1
              fi
              IFS=$'\t' read -r surface_id kind path marker parity_mode uptime_mode owners <<< "$line"
              validate_field "$row_number" surface_id "$surface_id" || return 1
              validate_field "$row_number" kind "$kind" || return 1
              validate_field "$row_number" path "$path" || return 1
              validate_field "$row_number" marker "$marker" || return 1
              validate_field "$row_number" parity_mode "$parity_mode" || return 1
              validate_field "$row_number" uptime_mode "$uptime_mode" || return 1
              validate_field "$row_number" owners "$owners" || return 1
              validate_enum "$row_number" kind "$kind" "static person_sitemap" || return 1
              validate_enum "$row_number" parity_mode "$parity_mode" "fatal known_red skip" || return 1
              validate_enum "$row_number" uptime_mode "$uptime_mode" "fatal skip" || return 1
              if grep -Fqx -- "$surface_id" "$SEEN_IDS_FILE"; then
                manifest_error "reason=duplicate_surface_id row=${row_number} value=${surface_id}"
                return 1
              fi
              printf '%s\n' "$surface_id" >> "$SEEN_IDS_FILE"
              existing_rows=$((existing_rows + 1))
            done
            exec 3<&-
            if [ "$existing_rows" -eq 0 ]; then
              manifest_error "reason=no_surface_rows"
              return 1
            fi
          }

          probe_url() {
            local surface_id="$1"
            local target="$2"
            local marker="$3"
            local body_file status curl_exit
            body_file="$(mktemp "${TMP_DIR}/body.XXXXXX")"
            set +e
            status=$(curl -sS "$target" --max-time 30 --write-out '%{http_code}' --output "$body_file")
            curl_exit=$?
            set -e
            if [ "$curl_exit" -ne 0 ]; then
              record_failure "$surface_id" "reason=curl_error status=${status:-000} exit=${curl_exit}"
            elif [ "$status" != "200" ]; then
              record_failure "$surface_id" "reason=http_status status=${status}"
            elif ! grep -Fq -- "$marker" "$body_file"; then
              record_failure "$surface_id" "reason=missing_marker status=${status}"
            else
              echo "public_surface_healthy surface_id=${surface_id} status=${status}"
              rm -f "$body_file"
              return 0
            fi
            rm -f "$body_file"
            return 1
          }

          probe_person_sitemap() {
            local surface_id="$1"
            local sitemap_path="$2"
            local marker="$3"
            local sitemap_target sitemap_file sitemap_status sitemap_exit specimen_target
            sitemap_target="${PROBE_BASE_URL%/}${sitemap_path}"
            sitemap_file="$(mktemp "${TMP_DIR}/sitemap.XXXXXX")"
            set +e
            sitemap_status=$(curl -sS "$sitemap_target" --max-time 30 --write-out '%{http_code}' --output "$sitemap_file")
            sitemap_exit=$?
            set -e
            if [ "$sitemap_exit" -ne 0 ]; then
              record_failure "$surface_id" "reason=sitemap_curl_error status=${sitemap_status:-000} exit=${sitemap_exit}"
              rm -f "$sitemap_file"
              return 1
            fi
            if [ "$sitemap_status" != "200" ]; then
              record_failure "$surface_id" "reason=sitemap_http_status status=${sitemap_status}"
              rm -f "$sitemap_file"
              return 1
            fi
            specimen_target=$(grep -o 'https\?://[^<]*/person/[^<]*' "$sitemap_file" | head -n 1 || true)
            rm -f "$sitemap_file"
            if [ -z "$specimen_target" ]; then
              record_failure "$surface_id" "reason=no_person_specimen status=${sitemap_status}"
              return 1
            fi
            probe_url "$surface_id" "$specimen_target" "$marker"
          }

          if ! gh api "repos/${{ github.repository }}/contents/infra/public_surface_probes.tsv?ref=${{ github.sha }}" --jq '.content' | base64 -d > "$MANIFEST_FILE"; then
            manifest_error "reason=fetch_failed" || true
            emit_outputs
            exit 1
          fi
          if ! validate_manifest; then
            emit_outputs
            exit 1
          fi

          exec 3< "$MANIFEST_FILE"
          IFS= read -r _ <&3
          manifest_line=""
          while IFS= read -r manifest_line <&3 || [ -n "$manifest_line" ]; do
            IFS=$'\t' read -r surface_id kind path marker parity_mode uptime_mode owners <<< "$manifest_line"
            if [ "$uptime_mode" != "fatal" ]; then
              continue
            fi
            if [ "$kind" = "static" ]; then
              probe_url "$surface_id" "${PROBE_BASE_URL%/}${path}" "$marker" || true
            else
              probe_person_sitemap "$surface_id" "$path" "$marker" || true
            fi
          done
          exec 3<&-

          emit_outputs
          if [ -n "$RED_IDS" ]; then
            exit 1
          fi

      - name: Check public deploy drift
        id: drift
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # This fatal mirror-side check detects deploy lag (public host not
          # serving the latest synced mirror commit) but cannot detect sync lag
          # (gridl-dev/civibus_dev main ahead of the mirror); the dev-repo
          # parity probe owns that limitation.
          manifest_json="$(
            gh api repos/${{ github.repository }}/contents/.debbie/sync_manifest.json --jq '.content' | base64 -d
          )"
          expected_sha="$(printf '%s' "$manifest_json" | jq -r '.dev_sha // empty')"
          api_sha="$(curl -fsS "${PROBE_BASE_URL%/}/api/health/version" | jq -r '.git_sha // "unknown"' || true)"
          web_sha="$(curl -fsS "${PROBE_BASE_URL%/}/version.json" | jq -r '.git_sha // "unknown"' || true)"

          if [[ ! "$expected_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::deploy lag check could not read a valid dev_sha from the mirror sync manifest"
            exit 1
          fi

          if [[ "$api_sha" == "$expected_sha" && "$web_sha" == "$expected_sha" ]]; then
            echo "deploy_drift_ok expected=$expected_sha api=$api_sha web=$web_sha"
            exit 0
          fi

          echo "::error::deploy lag detected for ${PROBE_BASE_URL}: expected=$expected_sha api=$api_sha web=$web_sha. This mirror-side warning cannot detect sync lag; the dev-repo parity probe owns that."
          exit 1

      - name: Find existing open uptime-incident issue
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUMBER=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label uptime-incident \
            --state open \
            --json number \
            --limit 1 \
            --jq '.[0].number // empty')
          echo "number=${NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Existing open uptime-incident issue: ${NUMBER:-none}"

      - name: Close existing issue (endpoint recovered)
        if: steps.probe.outputs.healthy == 'true' && steps.public_surfaces.outcome == 'success' && steps.public_surfaces.outputs.healthy == 'true' && steps.drift.outcome == 'success' && steps.find.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh issue comment "${{ steps.find.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --body "Probe at ${NOW} returned 200 healthy. Endpoint recovered. Closing."
          gh issue close "${{ steps.find.outputs.number }}" \
            --repo "${{ github.repository }}"

      - name: Comment on existing issue (endpoint still failing)
        if: (steps.probe.outputs.healthy == 'false' || steps.public_surfaces.outcome == 'failure' || steps.public_surfaces.outputs.healthy != 'true' || steps.drift.outcome == 'failure') && steps.find.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBE_DETAIL: ${{ steps.probe.outputs.detail }}
          PROBE_STATUS: ${{ steps.probe.outputs.status }}
          PROBE_TARGET: ${{ steps.probe.outputs.target }}
          PUBLIC_SURFACES_DETAIL: ${{ steps.public_surfaces.outputs.detail || 'public_surface_manifest_error' }}
          PUBLIC_SURFACES_HEALTHY: ${{ steps.public_surfaces.outputs.healthy }}
          PUBLIC_SURFACES_OUTCOME: ${{ steps.public_surfaces.outcome }}
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DETAIL="${PROBE_DETAIL}"
          STATUS="${PROBE_STATUS}"
          TARGET="${PROBE_TARGET}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RED_TOKENS=()
          RED_BLOCKS=""

          # Intentionally parallel with the Open step: Actions steps are
          # isolated shells and the contract harness executes this script alone.
          if [ "${{ steps.probe.outputs.healthy }}" = "false" ]; then
            RED_TOKENS+=("/api/health/content returned ${STATUS}")
            RED_BLOCKS="${RED_BLOCKS}

          content_health_probe
          - Endpoint: ${TARGET}
          - Owner: api/health_content.py + api/main.py:186
          - Status: ${STATUS}
          - Detail: ${DETAIL}"
          fi
          if [ "${PUBLIC_SURFACES_OUTCOME}" = "failure" ] || [ "${PUBLIC_SURFACES_HEALTHY}" != "true" ]; then
            RED_TOKENS+=("${PUBLIC_SURFACES_DETAIL}")
            RED_BLOCKS="${RED_BLOCKS}

          public_surface_probes
          - Detail: ${PUBLIC_SURFACES_DETAIL}"
          fi
          if [ "${{ steps.drift.outcome }}" = "failure" ]; then
            RED_TOKENS+=("public_deploy_drift")
            RED_BLOCKS="${RED_BLOCKS}

          public_deploy_drift
          - Backend endpoint: ${PROBE_BASE_URL%/}/api/health/version
          - Public endpoint: ${PROBE_BASE_URL%/}/version.json
          - Owner: .github/workflows/deploy.yml
          - Condition: observed public deploy version drift"
          fi
          RED_SUMMARY=$(IFS=", "; echo "${RED_TOKENS[*]}")
          gh issue comment "${{ steps.find.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --body "Probe at ${NOW} — still failing. Red probes now: ${RED_SUMMARY}.

          Run: ${RUN_URL}${RED_BLOCKS}"

      - name: Open new uptime-incident issue (endpoint failing, no existing issue)
        if: (steps.probe.outputs.healthy == 'false' || steps.public_surfaces.outcome == 'failure' || steps.public_surfaces.outputs.healthy != 'true' || steps.drift.outcome == 'failure') && steps.find.outputs.number == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBE_DETAIL: ${{ steps.probe.outputs.detail }}
          PROBE_STATUS: ${{ steps.probe.outputs.status }}
          PROBE_TARGET: ${{ steps.probe.outputs.target }}
          PUBLIC_SURFACES_DETAIL: ${{ steps.public_surfaces.outputs.detail || 'public_surface_manifest_error' }}
          PUBLIC_SURFACES_HEALTHY: ${{ steps.public_surfaces.outputs.healthy }}
          PUBLIC_SURFACES_OUTCOME: ${{ steps.public_surfaces.outcome }}
        run: |
          # Idempotent label create. --force lets us update the color/description
          # without erroring if the label already exists.
          gh label create uptime-incident \
            --repo="${{ github.repository }}" \
            --color FF6B6B \
            --description "${{ env.PROBE_BASE_URL }} uptime probe failure" \
            --force 2>/dev/null || true

          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          STATUS="${PROBE_STATUS}"
          DETAIL="${PROBE_DETAIL}"
          TARGET="${PROBE_TARGET}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RED_TOKENS=()
          RED_BLOCKS=""

          # Intentionally parallel with the Comment step: Actions steps are
          # isolated shells and the contract harness executes this script alone.
          if [ "${{ steps.probe.outputs.healthy }}" = "false" ]; then
            RED_TOKENS+=("/api/health/content returned ${STATUS}")
            RED_BLOCKS="${RED_BLOCKS}

          The ${{ env.PROBE_BASE_URL }} content health probe failed.

          **Status:** ${STATUS}
          **Detail:** ${DETAIL}
          **Probe time:** ${NOW}
          **Workflow run:** ${RUN_URL}

          - Endpoint: ${TARGET}
          - Owner: api/health_content.py + api/main.py:186"
          fi
          if [ "${PUBLIC_SURFACES_OUTCOME}" = "failure" ] || [ "${PUBLIC_SURFACES_HEALTHY}" != "true" ]; then
            RED_TOKENS+=("${PUBLIC_SURFACES_DETAIL}")
            RED_BLOCKS="${RED_BLOCKS}

          public_surface_probes failed.

          **Probe time:** ${NOW}
          **Workflow run:** ${RUN_URL}

          - Detail: ${PUBLIC_SURFACES_DETAIL}"
          fi
          if [ "${{ steps.drift.outcome }}" = "failure" ]; then
            RED_TOKENS+=("public_deploy_drift")
            RED_BLOCKS="${RED_BLOCKS}

          public_deploy_drift failed.

          **Probe time:** ${NOW}
          **Workflow run:** ${RUN_URL}

          - Backend endpoint: ${PROBE_BASE_URL%/}/api/health/version
          - Public endpoint: ${PROBE_BASE_URL%/}/version.json
          - Owner: .github/workflows/deploy.yml
          - Condition: observed public deploy version drift"
          fi
          RED_SUMMARY=$(IFS=", "; echo "${RED_TOKENS[*]}")

          BODY="The ${{ env.PROBE_BASE_URL }} production uptime probe detected red surface(s): ${RED_SUMMARY}.
          ${RED_BLOCKS}

          This issue was auto-created by .github/workflows/uptime_probe.yml.
          Subsequent failures will comment here (not open new issues). The
          workflow will auto-close this issue when every production surface
          probe is green.

          - Anchored postmortem: docs/howto/operations/postmortems/2026_04_30_prod_data_link_severed.md"

          gh issue create \
            --repo "${{ github.repository }}" \
            --label uptime-incident \
            --title "[uptime] production surface red: ${RED_SUMMARY} at ${NOW}" \
            --body "${BODY}"

      - name: Fail the run when any production surface probe was red
        if: ${{ always() }}
        env:
          # Trusted enum values produced by Actions itself ('success' /
          # 'failure' / 'skipped'), never response bodies -- safe to expand into
          # shell, unlike the probe detail which stays env-passed above.
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
          PUBLIC_SURFACES_HEALTHY: ${{ steps.public_surfaces.outputs.healthy }}
          PUBLIC_SURFACES_OUTCOME: ${{ steps.public_surfaces.outcome }}
        run: |
          set -euo pipefail
          # The surface probes suppress their own abort so the issue flow can
          # run. This step re-imposes the failure, so a red surface still turns
          # the run red. Without it the probes would be advisory and the run
          # would go green while production was broken.
          red=""
          if [ "${PUBLIC_SURFACES_OUTCOME}" = "failure" ] || [ "${PUBLIC_SURFACES_HEALTHY}" != "true" ]; then
            red="${red} public_surface_probes"
          fi
          [ "${DRIFT_OUTCOME}" = "failure" ] && red="${red} public_deploy_drift"
          if [ -n "${red}" ]; then
            echo "::error::production surface probe red:${red}"
            exit 1
          fi
          echo "all_production_surface_probes_green"

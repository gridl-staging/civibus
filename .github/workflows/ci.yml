name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# One required fast job answers every push and PR with the qa-fast composition
# (lint, web unit tests + typecheck, and the profiled DB-free Python
# selection) through its Makefile owner. The build job keeps the production
# web build as parallel, non-blocking signal. Exhaustive proof deliberately
# lives elsewhere: nightly.yml owns the full suites on a schedule, and
# integration.yml owns DB-backed proof for database-risk changes.
jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Sync dependencies
        run: uv sync --locked --extra dev --extra entity-resolution
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: qa-fast (public locality)
        # Hard cap owned by tests/ci/pytest_tier_classifier.py::SUITE_TIME_BUDGETS
        # (qa_medium tier); pinned by test_suite_time_budget_contract.py.
        timeout-minutes: 10
        run: make qa-fast-public

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Web production build
        working-directory: web
        run: npm run build
